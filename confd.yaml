# confd configuration file.
#
# This is the single source of truth for confd's runtime configuration.
# CLI flags override values set here; any flag not set falls back to the
# YAML value, then to the compiled-in default.
#
# Usage:
#   confd serve --config /etc/confd/confd.yaml
#   confd serve --config /etc/confd/confd.yaml --bind=0.0.0.0:1830

# SSH listener
ssh:
  bind: "0.0.0.0:830"
  host_key: ""            # path to SSH host key (empty = ephemeral ed25519)
  password: "confd"         # if set, password auth is enabled

# Sysrepo backend
adapter: sysrepo          # "sysrepo" (cgo, default) or "mock" (in-memory, for tests)
sysrepo_socket: ""        # path to sysrepo SHM socket (empty = default)

# Plugins (sysrepo-plugind replacement).
# In "auto" mode (default), confd discovers libsrplg-*.so files from
# plugins.dir and YANG files from plugins.yang_dir automatically.
# Features are parsed from YANG feature declarations.
# In "manual" mode, use plugins.entries for explicit control.
plugins:
  dir: "/usr/lib/confd/plugins"     # directory containing libsrplg-*.so
  yang_dir: "/usr/lib/confd/yang"   # base directory for YANG files (auto mode)
  mode: "auto"                       # "auto" (default) or "manual"
  names: []                         # allowlist of plugin names (empty = all)
  # entries: []                     # only used when mode: "manual"
