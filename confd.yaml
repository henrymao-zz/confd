# confd configuration file.
# This is the single source of truth for confd's runtime configuration.
# CLI flags override values set here; any flag not set falls back to the
# YAML value, then to the compiled-in default.
#
# Usage:
#   confd serve --config /etc/confd/confd.yaml
#   confd serve --config /etc/confd/confd.yaml --bind=0.0.0.0:1830

# SSH listener
ssh:
  bind: "0.0.0.0:830"
  host_key: ""            # path to SSH host key (empty = ephemeral ed25519)
  password: ""           # if set, password auth is enabled

# Sysrepo backend
adapter: sysrepo          # "sysrepo" (cgo, default) or "mock" (in-memory, for tests)
sysrepo_socket: ""        # path to sysrepo SHM socket (empty = default)

# YANG provisioning
# The manifest lists each plugin's YANG modules and features. confd
# installs missing modules into sysrepo on startup via sr_install_module,
# then loads the same YANG directories into the goyang cache so that
# <hello> capabilities and <get-schema> match what's in sysrepo.
yang_manifest: ""         # path to a plugins.yaml manifest file
                          # if empty, no YANG provisioning is done

# Plugins (sysrepo-plugind replacement)
plugins:
  dir: ""                 # directory containing libsrplg-*.so (empty = no plugins)
  names: []               # allowlist of plugin names (empty = load all in dir)
