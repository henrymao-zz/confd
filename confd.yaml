#   dir: "/usr/lib/confd/plugins"
#   names:
#     - ietf-system
#     - ietf-interfaces
#     - ietf-routing
#     - ieee802-dot1q-bridge
#     - ietf-access-control-list
#     - ietf-hardware
#     # os-metrics is disabled by default (requires libprocps on Ubuntu 26.04)
